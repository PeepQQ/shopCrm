name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Codespace

    steps:
      - uses: actions/checkout@v4
            
      - name: Create codespace ssh config
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          gh codespace ssh --config -c ${{ secrets.CODESPACE }} > /tmp/codespace_ssh_config

      - name: Codespace build and run new image
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          CLIENT_PORT: ${{ secrets.CLIENT_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          ssh -F /tmp/codespace_ssh_config cs.${{ secrets.CODESPACE }}.main -T '
            set -e
            cd /workspaces/shopCrm
            ls
            git pull
            cat <<EOF > .env
            SERVER_PORT='"$SERVER_PORT"'
            CLIENT_PORT='"$CLIENT_PORT"'
            JWT_SECRET='"$JWT_SECRET"'
            CLIENT_URL='"$CLIENT_URL"'
            EOF
            
            docker compose build
            docker compose up -d
          '
