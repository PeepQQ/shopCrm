name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Test

    steps:
      - uses: actions/checkout@v4
            
      - name: Create codespace ssh config
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          gh codespace ssh --config -c ${{ secrets.CODESPACE }} > /tmp/codespace_ssh_config

      - name: Codespace build and run new image
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          ssh -F /tmp/codespace_ssh_config cs.${{ secrets.Codespace }}.main -T '
            set -e
            cd /workspaces/shopCrm
            ls
            
            git pull
            docker build -f ./shop_client/dockerfile -t shop_client ./shop_client
            docker stop shop_client || true
            docker run -d --rm -p 3000:3000 --name shop_client shop_client
          '