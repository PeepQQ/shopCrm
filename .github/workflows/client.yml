name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Codespace

    steps:
      - uses: actions/checkout@v4
            
      - name: Create codespace ssh config
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          gh codespace ssh --config -c ${{ secrets.CODESPACE }} > /tmp/codespace_ssh_config

      - name: Codespace build and run new image
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          CLIENT_PORT: ${{ secrets.CLIENT_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          cat <<EOF > .env
          SERVER_PORT=$SERVER_PORT
          CLIENT_PORT=$CLIENT_PORT
          JWT_SECRET=$JWT_SECRET
          CLIENT_URL=$CLIENT_URL
          EOF

          HOST_NAME="cs.${{ secrets.CODESPACE }}.main"
          scp -F /tmp/codespace_ssh_config .env $HOST_NAME:/workspaces/shopCrm/.env

          ssh -F /tmp/codespace_ssh_config $HOST_NAME -T '
            set -e
            cd /workspaces/shopCrm
            git pull
            docker builder prune -a -f
            docker compose build
            command docker compose up -d
          '
