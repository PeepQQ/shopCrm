name: Shop_Client Build

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Test

    defaults:
      run:
        working-directory: shop_client

    steps:
        - uses: actions/checkout@v4
            
        - name: Create codespace ssh config
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            gh codespace ssh --config -c redesigned-dollop-97vq557pgqwgc7p7g > /tmp/codespace_ssh_config

        - name: Codespace ssh connection
          run: |
            ssh -F /tmp/codespace_ssh_config cs.${{ secrets.Codespace }} -T
        
