name: Shop_Client Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Test

    defaults:
      run:
        working-directory: shop_client

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'shop_client/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Clean Next.js cache
        run: |
          rm -rf .next
          rm -rf node_modules/.cache
        
      - name: Build project
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}
